[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classgraph"
version = "1.0.0"
description = "Classroom engagement analysis: detection, identity, behaviour and a learned attention score"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClassGraph" }]
keywords = ["computer-vision", "classroom", "engagement", "attention"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime floor only. Versions are pinned in requirements.txt for a
# reproducible install; this range is what the code is known to work against.
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.9,<5.0",
    # 8.3.41 and 8.3.42 shipped a cryptominer in December 2024.
    "ultralytics>=8.3.43,<9.0",
    "mediapipe>=0.10,<0.11",
    "insightface>=0.7,<0.8",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "python-multipart>=0.0.9,<0.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# The learned scorers. Kept optional because the rule-based pipeline runs
# without them, and torch is a 2GB install nobody should pay for by accident.
learned = ["torch>=2.2"]
gpu = ["onnxruntime-gpu>=1.17"]
# Encryption at rest for the face gallery. Optional because the
# system runs without it, and because a passphrase has to come from
# the operator -- a key stored beside the data secures nothing.
secure = ["cryptography>=42.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
# One command per thing a user actually wants to do. Each maps to a main()
# that already existed; no new entry-point logic.
classgraph = "classgraph.cli:main"
classgraph-server = "tools.server:main"
classgraph-batch = "tools.batch_session:main"

[project.urls]
Repository = "https://github.com/pranayr710/cv"

[tool.setuptools]
packages = ["backend", "tools", "classgraph"]
include-package-data = true

[tool.setuptools.package-data]
"tools" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The deck builders are one-off scripts, not shipped code.
extend-exclude = ["build_*.py", "verify_ppt.py", ".venv"]

[tool.ruff.lint]
# Ruff's default selection, which is what this codebase was written against
# and currently passes cleanly. Widening it flags ~200 pre-existing lines --
# mostly deliberate choices like function-level imports of torch and
# ultralytics, which cost seconds to load and must not be paid for by a
# pipeline that will not use them. Tightening the rules is a separate piece of
# work from making the project installable, and mixing the two would bury the
# deployment changes in unrelated churn.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Every tool begins with sys.path.insert so it runs both as `python tools/x.py`
# and as `python -m tools.x`. The backend imports that follow are therefore
# below code by necessity, not by accident.
"tools/*" = ["E402"]
"tests/*" = ["E402", "E702"]
"classgraph/*" = ["E402"]
